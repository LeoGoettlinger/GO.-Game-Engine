# Publish only the two synthetic-fixture captures from the specified completed run.
name: GO. Preserve UI Evidence
on:
  workflow_dispatch:
  push:
    branches: [arena/a15e5657-go-game-engine]
    paths: ['.github/workflows/go-publish-ui-evidence.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: go-ui-evidence-${{ github.ref }}
  cancel-in-progress: false
jobs:
  preserve:
    if: github.ref == 'refs/heads/arena/a15e5657-go-game-engine'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/a15e5657-go-game-engine
      - name: Download the existing real Linux editor/player captures
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 46048025646
          name: GO-validation-linux-46048025646
          path: .cache/ui-evidence
      - name: Preserve only synthetic screenshot evidence with provenance
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          root = Path('.cache/ui-evidence')
          target = Path('docs/go/evidence/551a0fa2')
          target.mkdir(parents=True, exist_ok=True)
          report = {
              'run_id': 46048025646,
              'commit': '551a0fa299b6f817c0d7326e7827447702b5c81a',
              'scope': 'Actual Linux X11 captures of the synthetic editor-created player fixture; not generated artwork. Full run later failed plugin startup.',
              'files': {},
          }
          for name in ('editor-ui.png', 'player-ui.png'):
              matches = list(root.rglob(name))
              if len(matches) != 1:
                  raise SystemExit(f'Expected exactly one {name}')
              data = matches[0].read_bytes()
              if not data.startswith(b'\x89PNG\r\n\x1a\n') or not 1024 <= len(data) <= 5 * 1024 * 1024:
                  raise SystemExit(f'Invalid or oversized PNG: {name}')
              (target / name).write_bytes(data)
              report['files'][name] = hashlib.sha256(data).hexdigest()
          (target / 'provenance.json').write_text(json.dumps(report, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Commit evidence to the same active branch only
        run: |
          git config user.name 'GO. validation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/go/evidence/551a0fa2/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs(go): preserve actual editor and player captures from 551a0fa2 [skip ci]"
          git pull --rebase origin arena/a15e5657-go-game-engine
          git push origin arena/a15e5657-go-game-engine
