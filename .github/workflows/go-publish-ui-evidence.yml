# Preserve real synthetic-fixture captures only, never execute downloaded artifacts.
name: GO. Preserve UI Evidence
on:
  push:
    branches: [arena/a15e5657-go-game-engine]
    paths: ['.github/workflows/go-publish-ui-evidence.yml']
  workflow_dispatch:
    inputs:
      run_id:
        description: Completed GO. Build and Release run on this active branch
        required: true
        type: string
permissions:
  contents: write
  actions: read
concurrency:
  group: go-ui-evidence-${{ github.ref }}
  cancel-in-progress: false
jobs:
  preserve:
    if: github.ref == 'refs/heads/arena/a15e5657-go-game-engine'
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/a15e5657-go-game-engine
      - name: Verify run provenance before downloading
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id || '46071744551' }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import time
          from pathlib import Path
          run_id = os.environ['RUN_ID']
          if not run_id.isascii() or not run_id.isdecimal():
              raise SystemExit('Expected a numeric workflow run ID')
          deadline = time.monotonic() + 150 * 60
          while time.monotonic() < deadline:
              run = json.loads(subprocess.check_output([
                  'gh', 'api', f'repos/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{run_id}'
              ]))
              if run['status'] == 'completed':
                  break
              time.sleep(60)
          else:
              raise SystemExit('Full build did not finish before evidence deadline')
          if (run['status'] != 'completed'
                  or run['head_branch'] != 'arena/a15e5657-go-game-engine'
                  or run['head_repository']['full_name'] != os.environ['GITHUB_REPOSITORY']
                  or run['path'] != '.github/workflows/go-build.yml'):
              raise SystemExit('Only completed full builds from this repository and active branch are allowed')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('run_id=' + run_id + '\n')
          Path('.cache').mkdir(exist_ok=True)
          Path('.cache/ui-source-run.json').write_text(json.dumps(run), encoding='utf-8')
          PY
      - name: Download existing real Linux editor/player captures
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.run_id }}
          name: GO-validation-linux-${{ steps.source.outputs.run_id }}
          path: .cache/ui-evidence
      - name: Preserve only synthetic screenshot evidence with provenance
        run: |
          python - <<'PY'
          import hashlib
          import json
          import re
          from pathlib import Path
          run = json.loads(Path('.cache/ui-source-run.json').read_text(encoding='utf-8'))
          sha = run['head_sha']
          if not re.fullmatch(r'[0-9a-f]{40}', sha):
              raise SystemExit('Invalid source revision')
          root = Path('.cache/ui-evidence')
          target = Path('docs/go/evidence') / sha[:8]
          target.mkdir(parents=True, exist_ok=True)
          report = {
              'run_id': run['id'],
              'commit': sha,
              'conclusion': run['conclusion'],
              'url': run['html_url'],
              'scope': 'Actual Linux X11 synthetic-fixture captures, not generated artwork. Images alone do not prove UI interaction or full release acceptance.',
              'files': {},
          }
          for name in ('editor-ui.png', 'player-ui.png'):
              matches = list(root.rglob(name))
              if len(matches) != 1 or matches[0].is_symlink():
                  raise SystemExit(f'Expected exactly one regular {name}')
              if not 1024 <= matches[0].stat().st_size <= 5 * 1024 * 1024:
                  raise SystemExit(f'Invalid or oversized PNG: {name}')
              data = matches[0].read_bytes()
              if not data.startswith(b'\x89PNG\r\n\x1a\n'):
                  raise SystemExit(f'Invalid PNG: {name}')
              (target / name).write_bytes(data)
              report['files'][name] = hashlib.sha256(data).hexdigest()
          (target / 'provenance.json').write_text(json.dumps(report, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Commit evidence to the same active branch only
        run: |
          git config user.name 'GO. validation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/go/evidence/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs(go): preserve actual editor and player captures with verified provenance [skip ci]"
          git pull --rebase origin arena/a15e5657-go-game-engine
          git push origin arena/a15e5657-go-game-engine
