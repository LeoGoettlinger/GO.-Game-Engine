name: GO. Pinned Extension Bundles
on:
  workflow_dispatch:
  push:
    paths:
      - 'go_bundled_plugins/plugins.json'
      - 'misc/scripts/go_bundle_extensions*'
      - '.github/workflows/go-extension-bundles.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Archive safety regressions
        run: python misc/scripts/go_bundle_extensions_test.py
      - name: Verify Linux bundles
        run: python misc/scripts/go_bundle_extensions.py --platform linux --output .cache/linux
      - name: Verify Windows bundles
        run: python misc/scripts/go_bundle_extensions.py --platform windows --output .cache/windows
      - uses: actions/upload-artifact@v4
        with:
          name: checksum-verified-extension-bundles
          path: .cache/linux/
          include-hidden-files: true
