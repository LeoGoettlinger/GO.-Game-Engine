name: GO. Compiled Plugin Acceptance
on:
  push:
    branches: [arena/a15e5657-go-game-engine]
    paths: ['.github/workflows/go-plugin-candidate.yml', '.github/workflows/go-build.yml']
  workflow_dispatch:
    inputs:
      run_id:
        description: Full-build run that already uploaded the editor candidate
        required: true
        type: string
      platform:
        description: Candidate platform
        required: true
        type: choice
        options: [linux, windows, both]
        default: both
permissions:
  contents: read
  actions: read
jobs:
  acceptance:
    if: github.ref == 'refs/heads/arena/a15e5657-go-game-engine'
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platform == 'linux' && '["linux"]' || inputs.platform == 'windows' && '["windows"]' || '["linux","windows"]') }}
    runs-on: ${{ matrix.platform == 'windows' && 'windows-2022' || 'ubuntu-22.04' }}
    timeout-minutes: 150
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify candidate source
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          SOURCE_SHA: ${{ github.sha }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          import time
          run_id = os.environ['RUN_ID']
          if not run_id:
              for attempt in range(60):
                  runs = json.loads(subprocess.check_output([
                      'gh', 'api', '-X', 'GET',
                      f'repos/{os.environ["GITHUB_REPOSITORY"]}/actions/workflows/go-build.yml/runs',
                      '-f', 'head_sha=' + os.environ['SOURCE_SHA'],
                      '-f', 'branch=arena/a15e5657-go-game-engine', '-f', 'event=push'
                  ]))['workflow_runs']
                  matches = [r for r in runs if r['head_sha'] == os.environ['SOURCE_SHA']]
                  if matches:
                      run_id = str(matches[0]['id'])
                      break
                  time.sleep(10)
              else:
                  raise SystemExit('No full build found for this exact source revision')
          if not re.fullmatch(r'[0-9]+', run_id):
              raise SystemExit('Invalid run ID')
          run = json.loads(subprocess.check_output([
              'gh', 'api', f'repos/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{run_id}'
          ]))
          if (run['head_branch'] != 'arena/a15e5657-go-game-engine'
                  or run['head_repository']['full_name'] != os.environ['GITHUB_REPOSITORY']
                  or run['path'] != '.github/workflows/go-build.yml'
                  or not re.fullmatch(r'[0-9a-f]{40}', run['head_sha'])):
              raise SystemExit('Candidate is not a full build from the active repository branch')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('sha=' + run['head_sha'] + '\n')
              output.write('run_id=' + run_id + '\n')
          deadline = time.monotonic() + 90 * 60
          while time.monotonic() < deadline:
              artifacts = json.loads(subprocess.check_output([
                  'gh', 'api', f'repos/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{run_id}/artifacts'
              ]))['artifacts']
              expected = 'go-editor-candidate-' + os.environ['PLATFORM']
              if any(a['name'] == expected and not a['expired'] for a in artifacts):
                  break
              state = json.loads(subprocess.check_output([
                  'gh', 'api', f'repos/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{run_id}'
              ]))
              if state['status'] == 'completed':
                  raise SystemExit('Full build ended without the required editor candidate')
              time.sleep(60)
          else:
              raise SystemExit('Timed out waiting for compiled editor candidate')
          PY
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.run_id }}
          name: go-editor-candidate-${{ matrix.platform }}
          path: bin
      - name: Record provenance and prepare executable
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          SOURCE_RUN: ${{ steps.source.outputs.run_id }}
        run: |
          mkdir -p go-plugin-validation
          printf 'source=%s\nrun=%s\n' "$SOURCE_SHA" "$SOURCE_RUN" > go-plugin-validation/provenance.txt
          if [ "${{ matrix.platform }}" = "linux" ]; then
            chmod +x bin/godot.linuxbsd.editor.x86_64
          fi
      - name: Validate manifest and fetch checksum-pinned native addons
        shell: bash
        run: |
          python misc/scripts/go_validate_plugins.py
          python misc/scripts/go_bundle_extensions.py --platform ${{ matrix.platform }} --output .cache/go-extensions
      - name: Test each addon in the compiled candidate
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "linux" ]; then
            EDITOR=bin/godot.linuxbsd.editor.x86_64
          else
            EDITOR=bin/godot.windows.editor.x86_64.exe
          fi
          python misc/scripts/go_plugin_startup_smoke.py --editor "$EDITOR" \
            --extensions-dir .cache/go-extensions --output go-plugin-validation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: go-plugin-candidate-${{ matrix.platform }}-${{ github.run_id }}
          path: go-plugin-validation/
          if-no-files-found: warn
